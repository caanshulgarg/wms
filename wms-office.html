    <h3>New GST rates: ${p.items.rates.length}</h3>${list(p.items.rates, r => `${esc(r.name)} <span class="muted">${r.was ?? '-'}% → ${r.gst_rate}% from ${fmtDate(r.effective_from)}</span>`)}
    <h3>New parties: ${p.parties.create.length}</h3>${list(p.parties.create, c => `${esc(c.name)} <span class="muted">${c.party_type}${c.gstin ? ', ' + esc(c.gstin) : ''}</span>`)}
    <h3>Parties to update: ${p.parties.update.length}</h3>${list(p.parties.update, u => `${esc(u.name)} <span class="muted">${esc(Object.keys(u.changes).join(', '))}</span>`)}
    ${p.items.skipped.length ? `<h3>Not brought in: ${p.items.skipped.length}</h3>${list(p.items.skipped, x => `${esc(x.name)} <span class="muted">${esc(x.why)}</span>`)}` : ''}`,
    n ? `Apply ${n} change${n > 1 ? 's' : ''}` : 'Close', async () => {
      if (!n) return;
      const r = await pullApply(p);
      toast(`From Tally: ${pullSummary(r)}.${r.errors.length ? ' Problems: ' + r.errors.slice(0, 2).join('; ') : ''}`, r.errors.length ? 'err' : '');
    }, true);
}

/* ---------- automatic two-way sync ----------
   Runs in this page on the Tally computer (the bridge opens it at sign-in).
   A lease in the database lets only one computer sync at a time. */
const AUTO = {holder:(crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)), timer:null, busy:false, state:null};
const autoHere = () => !!LS.get('wms.auto.here.' + S.tenant, false);
async function autoLoadState(){
  const {data} = await S.sb.from('tally_auto_state').select('*').eq('tenant_id', S.tenant).maybeSingle();
  AUTO.state = data || null;
  return AUTO.state;
}
function autoStart(){
  clearInterval(AUTO.timer);
  AUTO.timer = setInterval(() => autoTick(), 60000);
  setTimeout(() => autoTick(), 4000);
}
async function autoTick(force){
  if (AUTO.busy || !S.tenant || !S.sb) return;
  const st = await autoLoadState().catch(() => null);
  autoRefreshStatus();
  if (!st || !(st.push_on || st.pull_on) || !autoHere() || !bridgeCfg().key) return;
  const mine = st.holder === AUTO.holder && st.lease_until && new Date(st.lease_until) > new Date();
  const due = force || !st.last_run_at || !mine || Date.now() - new Date(st.last_run_at) >= st.every_min * 60000 - 5000;
  if (!due) return;
  const {data:granted} = await S.sb.rpc('tally_auto_claim', {p_tenant:S.tenant, p_holder:AUTO.holder,
    p_label:(S.user?.email || 'someone') + ' on ' + (AUTO.computer || 'the Tally computer'), p_seconds:st.every_min * 60 + 180});
  if (!granted) return autoRefreshStatus();
  AUTO.busy = true;
  let push = null, pull = null;
  try{
    const co = await bridgeCall('/companies');
    const open = (co.companies || []).map(x => x.name);
    if (!AUTO.computer){ try{ const s2 = await bridgeCall('/status'); AUTO.computer = s2.computer; }catch(e){} }
    if (st.push_on){
      const since = new Date(Date.now() - 30 * 60000).toISOString();
      const [{data:q, error:qe}, {data:fails}] = await Promise.all([
        S.sb.from('v_tally_queue').select('*').eq('tenant_id', S.tenant).order('doc_date').limit(2000),
        S.sb.from('tally_sync_log').select('entity_id').eq('tenant_id', S.tenant).eq('status', 'failed').gte('created_at', since).limit(5000)]);
      if (qe) throw qe;
      const recent = new Set((fails || []).map(f => f.entity_id));      // failed in the last 30 minutes: try again later, not every minute
      const all = q || [];
      const notOpen = [...new Set(all.map(r => tallyCompanyFor(r.gstin)).filter(c => c && !open.includes(c)))];
      const ready = all.filter(r => !recent.has(r.entity_id) && open.includes(tallyCompanyFor(r.gstin)));
      const batch = ready.slice(0, 300);
      const res = batch.length ? await pushRows(batch, true) : {ok:0, bad:0, masterErr:[]};
      push = {at:new Date().toISOString(), sent:res ? res.ok : 0, failed:res ? res.bad : 0, waiting:all.length - (res ? res.ok : 0),
              held_back:recent.size ? all.filter(r => recent.has(r.entity_id)).length : 0, not_open:notOpen,
              no_company:all.filter(r => !tallyCompanyFor(r.gstin)).length};
    }
    const lastPull = st.last_pull && st.last_pull.at ? new Date(st.last_pull.at) : null;
    if (st.pull_on && (force || !lastPull || Date.now() - lastPull >= 30 * 60000)){
      const P = await pullPlan();
      const r = await pullApply(P.plan);
      pull = {at:new Date().toISOString(), ...r, errors:r.errors.slice(0, 5)};
    }
  }catch(e){
    const msg = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'The Tally Bridge is not answering on this computer.' : e.message;
    if (st.push_on && !push) push = {at:new Date().toISOString(), error:msg};
    else if (st.pull_on) pull = {at:new Date().toISOString(), error:msg, ...(pull || {})};
  }finally{
    await S.sb.rpc('tally_auto_report', {p_tenant:S.tenant, p_holder:AUTO.holder, p_push:push, p_pull:pull});
    AUTO.busy = false;
    await autoLoadState().catch(() => null);
    autoRefreshStatus();
    if (push && push.sent && S.rep && ['tallysync','tallylog'].includes(S.rep.id) && !S.pop && !document.querySelector('.modal-bg')) load();
  }
}
const hhmm = t => t ? new Date(t).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : '';
function autoStatusHtml(){
  const st = AUTO.state;
  if (!st || !(st.push_on || st.pull_on)) return `<p class="autostat off" id="autostat">Automatic sync is off. Use <b>Automatic sync…</b> to switch it on.</p>`;
  const live = st.lease_until && new Date(st.lease_until) > new Date();
  const p = st.last_push || {}, q = st.last_pull || {};
  const what = [st.push_on && `sends new entries every ${st.every_min} min`, st.pull_on && 'brings new items and parties every 30 min'].filter(Boolean).join(' and ');
  const parts = [];
  if (st.push_on && p.at) parts.push(p.error ? `sending stopped at ${hhmm(p.at)}: ${esc(p.error)}` :
    `${hhmm(p.at)}: ${p.sent} sent${p.failed ? `, <b>${p.failed} failed</b>` : ''}${p.waiting ? `, ${p.waiting} waiting` : ''}${p.not_open && p.not_open.length ? `; not open in Tally: ${esc(p.not_open.join(', '))}` : ''}${p.no_company ? `; ${p.no_company} with no Tally company set` : ''}`);
  if (st.pull_on && q.at) parts.push(q.error ? `bringing from Tally stopped at ${hhmm(q.at)}: ${esc(q.error)}` : `from Tally at ${hhmm(q.at)}: ${pullSummary(q)}${q.skipped ? `, ${q.skipped} not brought in` : ''}`);
  const who = live ? `Running on ${esc(st.holder_label || 'the Tally computer')}${st.holder === AUTO.holder ? ' (this window)' : ''}.`
                   : `<b>No computer is syncing now.</b> Keep Warehouse Office open on the Tally computer${autoHere() ? '' : ' and tick “Run on this computer” there'}.`;
  const bad = !live || p.error || q.error || p.failed;
  return `<p class="autostat ${bad ? 'warn' : 'on'}" id="autostat">Automatic sync ${what}. ${who}${parts.length ? ' Last: ' + parts.join('. ') + '.' : ''}</p>`;
}
function autoRefreshStatus(){ const el = document.getElementById('autostat'); if (el) el.outerHTML = autoStatusHtml(); }
function autoSettings(){
  const st = AUTO.state || {push_on:false, pull_on:false, every_min:5};
  modal('Automatic Tally sync', `
    <p class="note">Automatic sync runs in Warehouse Office on the computer where TallyPrime and the Tally Bridge run. The bridge opens it by itself when that computer starts; keep TallyPrime open with your company.</p>
    <label class="chk"><input type="checkbox" id="ap" ${st.push_on ? 'checked' : ''}> Send new WMS entries to Tally by themselves</label>
    <label class="chk"><input type="checkbox" id="aq" ${st.pull_on ? 'checked' : ''}> Bring new items and parties from Tally by themselves</label>
    <label for="am">Check every</label>
    <select id="am">${[2, 5, 10, 15, 30, 60].map(m => `<option value="${m}" ${m === st.every_min ? 'selected' : ''}>${m} minutes</option>`).join('')}</select>
    <label class="chk" style="margin-top:14px"><input type="checkbox" id="ah" ${autoHere() ? 'checked' : ''}> Run on this computer (tick only on the Tally computer)</label>
    <p class="note">Only one computer syncs at a time, so no entry is sent twice. Entries that fail are tried again after 30 minutes and shown under Last error.
      From Tally, WMS only adds what is missing and fills blanks; it never renames or removes anything. Stock quantities are not brought back from Tally,
      because WMS sends its own stock movements there.</p>`, 'Save', async el => {
      const v = id => el.querySelector(id);
      const {error} = await S.sb.rpc('set_tally_auto', {p_tenant:S.tenant, p_push:v('#ap').checked, p_pull:v('#aq').checked, p_every:+v('#am').value});
      if (error){ toast(error.message, 'err'); return false; }
      LS.set('wms.auto.here.' + S.tenant, v('#ah').checked);
      if (v('#ah').checked && !bridgeCfg().key) toast('Now connect the Tally Bridge on this computer (Connect Tally Bridge).');
      else toast('Saved.');
      await autoLoadState(); autoRefreshStatus(); autoTick(true);
    });
}

async function tallyExport(){
  try{
    const R = await tallyBuild(); if (!R) return;
    const cos = Object.entries(R.byCompany);
    if (!cos.length) return toast('Nothing could be prepared. See Last error.', 'err');
    cos.forEach(([company, part]) => {
      download(`tally_masters_${safeName(company)}_${isoToday()}.xml`, WMSTally.envelope(company, part.masters, 'All Masters'), 'text/xml');
      download(`tally_vouchers_${safeName(company)}_${isoToday()}.xml`, WMSTally.envelope(company, part.vouchers, 'Vouchers'), 'text/xml');
    });
    const n = cos.reduce((a, [, p]) => a + p.vouchers.length, 0);
    setTimeout(async () => {
      if (!confirm(`In TallyPrime: Import, Masters first, then Transactions, using the downloaded files.\n\nMark these ${n} entries as sent to Tally?`)) return;
      const logs = cos.flatMap(([company, part]) => part.vouchers.map(v => ({tenant_id:S.tenant, entity:v.row.entity, entity_id:v.row.entity_id, action:v.row.action,
        side:v.row.side, status:'exported', message:'Exported as XML file', tally_company:company, voucher_no:v.voucherNo || null})));
      const {error} = await S.sb.from('tally_sync_log').insert(logs);
      if (error) return toast(error.message, 'err');
      toast(`${n} entries marked as sent.`); load();
    }, 400);
  }catch(e){ toast(e.message, 'err'); }
}
async function tallyMarkDone(r){
  if (!confirm(`Mark ${r.doc_no} as already entered in Tally? It will not be sent again.`)) return;
  const {error} = await S.sb.from('tally_sync_log').insert({tenant_id:S.tenant, entity:r.entity, entity_id:r.entity_id, action:r.action, side:r.side,
    status:'ok', message:'Marked as done by hand', tally_company:tallyCompanyFor(r.gstin) || null});
  if (error) return toast(error.message, 'err'); toast('Marked.'); load();
}

/* ---------- labels ---------- */
function labelForm(kind){
  const rows = sorted(filtered());
  if (!rows.length) return toast('No rows to print. Clear the filters first.', 'err');
  modal(`Print ${rows.length} ${kind === 'item' ? 'item' : 'bin'} label(s)`, `
    <p class="note">Prints the rows shown now. Use the column filters to choose which ${kind === 'item' ? 'items' : 'bins'}.</p>
    <label for="ls">Label size</label>
    <select id="ls"><option value="roll">50 × 25 mm thermal roll</option><option value="sheet">A4 sheet, 3 × 8 labels</option></select>
    <label for="lc">Copies of each</label><input id="lc" type="number" min="1" max="500" value="1">`,
    'Print', async el => {
      if (!window.JsBarcode){ toast('Barcode maker did not load. Check the connection.', 'err'); return false; }
      printLabels(kind, rows, el.querySelector('#ls').value, Math.max(1, Math.min(500, parseInt(el.querySelector('#lc').value, 10) || 1)));
    });
}
function printLabels(kind, rows, size, copies){
  let area = $('#printArea'); if (!area){ area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  let ps = $('#pageStyle'); if (!ps){ ps = document.createElement('style'); ps.id = 'pageStyle'; document.head.appendChild(ps); }
  ps.textContent = size === 'roll' ? '@page{size:50mm 25mm;margin:0}' : '@page{size:A4;margin:10mm 6mm}';
  const items = [];
  rows.forEach(r => { for (let i = 0; i < copies; i++) items.push(r); });
  area.className = size === 'roll' ? 'roll' : 'sheet';
  area.innerHTML = items.map((r, i) => kind === 'item'
    ? `<div class="lbl"><div class="t1">${esc(r.name)}</div><svg id="bc${i}"></svg><div class="t2">${esc(r.sku)}${r.mrp ? ' &nbsp; MRP ₹' + INR.format(r.mrp) : ''}</div></div>`
    : `<div class="lbl bin"><div class="t1">${esc(r.full_code)}</div><svg id="bc${i}"></svg><div class="t2">${esc(r.warehouse)}</div></div>`).join('');
  items.forEach((r, i) => {
    const code = kind === 'item' ? (S.lk.bc[r.id] || r.sku) : r.full_code;
    try{ JsBarcode(area.querySelector('#bc' + i), code, {format:'CODE128', height:size === 'roll' ? 34 : 40, width:1.3, margin:0, fontSize:10, displayValue:kind === 'item'}); }catch(e){}
  });
  document.body.classList.add('lbl-printing');
  setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('lbl-printing'), 500); }, 50);
}

/* ---------- export ---------- */
function exportXls(){
  if (!window.XLSX) return toast('Excel export did not load. Check the connection.', 'err');
  const rep = S.rep, rows = sorted(filtered());
  const data = rows.map(r => Object.fromEntries(rep.cols.map(c => [c.label,
    c.type === 'num' || c.type === 'money' ? (r[c.k] === null || r[c.k] === undefined ? null : num(r[c.k]))
    : c.type === 'bool' ? (r[c.k] ? 'Yes' : 'No') : shown(c, r)])));
  const ws = XLSX.utils.json_to_sheet(data), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, rep.title.slice(0, 31));
  const t = S.tenants.find(x => x.id === S.tenant) || {};
  XLSX.writeFile(wb, `${(t.name || 'Company').replace(/[^\w]+/g, '-')}_${rep.id}_${isoToday()}.xlsx`);
}

/* ---------- events (one delegated handler) ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const ng = t.closest('[data-grp]'); if (ng){ toggleNavGroup(ng.dataset.grp); return; }
  if (t.closest('#menubtn')){ S.menuOpen = !S.menuOpen; render(); if (S.menuOpen) { const q = $('#navq'); if (q && matchMedia('(min-width:821px)').matches) q.focus(); } return; }
  const a = t.closest('[data-rep]'); if (a){ e.preventDefault(); if (a.closest('nav')){ S.navq = ''; S.menuOpen = false; } openReport(REPORTS.find(r => r.id === a.dataset.rep)); return; }
  const ac = t.closest('[data-act]');
  if (ac){ const [ri, ai] = ac.dataset.act.split('|').map(Number); const act = S.rep.actions(S.page[ri])[ai]; if (act) act.fn(); return; }
  const tl = t.closest('[data-tool]'); if (tl){ S.rep.tools[+tl.dataset.tool].fn(); return; }
  if (t.closest('.modal-bg') ) return;
  const cf = t.closest('[data-colf]');
  if (cf){
    const k = cf.dataset.colf;
    if (k === '__q'){ $('#q').focus(); return; }
    S.pop = S.pop && S.pop.k === k && !cf.classList.contains('fchip-l') ? null : {k, draft:{...(S.f[k] || {})}, justOpened:true};
    render(); return;
  }
  const sb = t.closest('[data-sort]');
  if (sb){ const k = sb.dataset.sort; S.sort = S.sort && S.sort.k === k ? {k, dir:S.sort.dir === 'asc' ? 'desc' : 'asc'} : {k, dir:'asc'}; render(); return; }
  if (t.closest('[data-chipx]')){ const k = t.closest('[data-chipx]').dataset.chipx; if (k === '__q') S.q = ''; else delete S.f[k]; LS.set('wms.f.' + S.rep.id, S.f); render(); return; }
  if (t.closest('[data-chipall]')){ S.f = {}; S.q = ''; S.pop = null; LS.set('wms.f.' + S.rep.id, S.f); render(); return; }
  if (t.closest('[data-cpclose]')){ S.pop = null; render(); return; }
  if (t.closest('[data-cpdone]')){ applyPop(true); return; }
  if (t.closest('[data-cpapply]')){ applyPop(true); return; }
  if (t.closest('[data-cpclear]')){
    S.pop.draft = {}; S.pop.search = '';
    if (S.auto){ delete S.f[S.pop.k]; LS.set('wms.f.' + S.rep.id, S.f); }
    render(); return;
  }
  const qk = t.closest('[data-cpquick]');
  if (qk){
    const [a1, b1] = quickRange(qk.dataset.cpquick), pop = $('#colpop');
    pop.querySelector('[data-pf="from"]').value = a1; pop.querySelector('[data-pf="to"]').value = b1;
    applyPop(true);   // a quick pick is a whole choice: apply and close
    return;
  }
  const dc = t.closest('[data-go]'); if (dc && S.rep && S.rep.custom){ openReport(REPORTS.find(r => r.id === dc.dataset.go)); return; }
  if (t.id === 'more'){ S.limit += 500; render(); return; }
  if (t.id === 'xls'){ exportXls(); return; }
  if (t.id === 'reload'){ load(); return; }
  if (t.id === 'so'){ signOut(); return; }
  if (S.menuOpen && !t.closest('nav')){ S.menuOpen = false; render(); return; }
  if (S.pop && !t.closest('#colpop')){ S.pop = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'coSel'){ useTenant(S.tenants.find(x => x.id === t.value)); return; }
  if (t.dataset.param){ S.params[t.dataset.param] = t.value; load(); return; }
  if (t.matches('[data-cpauto]')){ S.auto = t.checked; LS.set('wms.colAuto', S.auto); readPop(); render(); return; }
  if (t.matches('[data-cpall]')){
    const boxes = [...document.querySelectorAll('#colpop [data-pv]')]; boxes.forEach(b => b.checked = t.checked);
    if (S.auto) applyPop(false); return;
  }
  if (t.closest('#colpop') && S.auto && (t.matches('[data-pv]') || t.matches('[data-pf]'))) applyPop(false);
});
let typeT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ clearTimeout(typeT); typeT = setTimeout(() => { S.q = t.value; S.limit = 300; render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); return; }
  if (t.matches('[data-cpsearch]')){ readPop(); S.pop.search = t.value; S.pop.focus = '[data-cpsearch]'; render(); return; }
  if (S.auto && t.closest('#colpop') && t.matches('[data-pf]') && t.type === 'text'){
    clearTimeout(typeT); const sel = `[data-pf="${t.dataset.pf}"]`;
    typeT = setTimeout(() => { S.pop.focus = sel; applyPop(false); }, 350);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.modal-bg')){ closeModal(); return; }
  if (!S.pop) return;
  if (e.key === 'Escape'){ S.pop = null; render(); }
  if (e.key === 'Enter' && e.target.closest('#colpop') && e.target.type !== 'checkbox'){ e.preventDefault(); applyPop(true); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'navq') return;
  S.navq = e.target.value; const l = $('#navlist'); if (l && S.rep) l.innerHTML = navHtml(S.rep);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'navq' && e.key === 'Enter'){ const a = $('#navlist a'); if (a) a.click(); }
  if (e.key === 'Escape' && S.menuOpen && e.target.id !== 'navq'){ S.menuOpen = false; render(); }
  if (e.target.id === 'navq' && e.key === 'Escape'){ e.target.value = ''; S.navq = ''; $('#navlist').innerHTML = navHtml(S.rep); }
});
window.addEventListener('resize', placePop);
window.addEventListener('hashchange', () => { const r = REPORTS.find(x => x.id === location.hash.slice(1)); if (r && S.rep && r.id !== S.rep.id) openReport(r); });
boot();
</script>

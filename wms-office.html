<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="wms-print.js"></script>
<script src="wms-tally.js"></script>
<style>
:root{
  --concrete:#E4E2DC; --panel:#FFFFFF; --ink:#16213A; --ink2:#24345A; --muted:#5C6474;
  --line:#D3D0C7; --zebra:#F7F6F2; --hivis:#FFC400; --hivis-soft:#FFF1BF;
  --stop:#C62828; --go:#1E7B4F;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--concrete);color:var(--ink);font:15px/1.4 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.hidden{display:none!important}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
nav{background:var(--ink);color:#fff;overflow:auto;overscroll-behavior:contain;padding:16px 0 24px;min-height:0}
nav .navtop{display:flex;align-items:center;gap:10px}
nav .menubtn{display:none;margin-left:auto;margin-right:14px;background:#24345A;color:#fff;border:1px solid #3C4E78;border-radius:6px;height:34px;padding:0 12px;font:600 14px/1 var(--sans)}
nav .brand{font:700 22px/1 var(--cond);padding:0 18px 4px}
nav .co{padding:0 18px 14px;color:#C9D3EA;font-size:13px;border-bottom:1px solid #2E3F66;margin-bottom:8px}
nav .co button{background:none;border:0;color:#C9D3EA;text-decoration:underline;padding:0;font-size:13px}
nav h2{font:600 13px/1 var(--sans);color:#8E9BBB;margin:16px 18px 6px;letter-spacing:.2px}
nav .navq{margin:4px 14px 8px;width:calc(100% - 28px);height:32px;background:#24345A;color:#fff;border:1px solid #3C4E78;border-radius:6px;padding:0 10px;font-size:14px}
nav .navq::placeholder{color:#8E9BBB}
nav .ng{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:#C9D3EA;font:600 13px/1 var(--sans);letter-spacing:.3px;text-transform:uppercase;padding:11px 18px 9px;text-align:left;cursor:pointer}
nav .ng:hover{color:#fff;background:#1d2b4d}
nav .ng .cnt{margin-left:auto;background:#2E3F66;border-radius:9px;padding:2px 7px;font-size:11px;color:#C9D3EA}
nav .ng .chev{width:10px;transition:transform .15s}
nav .ng[aria-expanded="true"] .chev{transform:rotate(90deg)}
nav .ng.has-on{color:#fff}
nav .grp{padding-bottom:4px}
nav .grp[hidden]{display:none}
nav .nonav{padding:10px 18px;color:#8E9BBB;font-size:13px}
.autostat{margin:8px 0 0;padding:8px 12px;border-radius:6px;font-size:14px;flex-basis:100%;border-left:4px solid #8E9BBB;background:#F2F4F8}
.autostat.on{border-left-color:#1D6B3A;background:#EEF7F1}.autostat.warn{border-left-color:#B25E00;background:#FFF6EA}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:500}
ul.plist{margin:4px 0 10px 18px;padding:0}ul.plist li{margin:2px 0}.muted{color:var(--muted)}
nav a .sub{color:#8E9BBB;font-weight:400}
.tabs{flex-basis:100%;order:2;display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line,#D9DEE8);margin-top:4px;scrollbar-width:thin}
.tabs a{padding:9px 14px 8px;white-space:nowrap;color:#4A5570;text-decoration:none;border-bottom:3px solid transparent;font-weight:500;font-size:14px}
.tabs a:hover{color:var(--ink);background:#F2F4F8}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.head .tools{order:1}.head>p{order:4;flex-basis:100%}
nav a{display:block;padding:7px 18px 7px 34px;color:#E7ECF7;text-decoration:none;border-left:4px solid transparent;font-size:14px}
nav a:hover{background:var(--ink2)}
nav a.on{background:var(--ink2);border-left-color:var(--hivis);color:#fff;font-weight:600}

main{overflow:auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:18px 22px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.head h1{font:700 30px/1 var(--cond);margin:0;flex:1;min-width:220px}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px;flex-basis:100%}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tools input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.btn{height:34px;border:1px solid var(--ink);background:#fff;border-radius:6px;padding:0 12px;font-weight:600}
.btn.primary{background:var(--ink);color:#fff}
.btn.small{height:30px;padding:0 10px;font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:13.5px}

.chipbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 22px 10px}
.chipbar .count{color:var(--muted);font-size:13.5px;margin-right:4px}
.fchip{display:inline-flex;align-items:center;background:var(--hivis-soft);border:1px solid #E8C65A;border-radius:14px;overflow:hidden}
.fchip-l{border:0;background:none;padding:4px 4px 4px 10px;font-size:13px}
.fchip-x{border:0;background:none;padding:4px 9px 4px 4px;font-size:12px}
.fchip-x:hover{color:var(--stop)}

.tablewrap{margin:0 22px 22px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;flex:1;min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
thead th{position:sticky;top:0;z-index:2;background:#EFEDE7;border-bottom:1px solid var(--line);text-align:left;font-weight:600;padding:0;white-space:nowrap}
th.n,td.n{text-align:right}
.colh{display:flex;align-items:center;gap:4px;padding:8px 8px}
th.n .colh{justify-content:flex-end}
.sortbtn{background:none;border:0;padding:0;font-weight:600;text-align:inherit}
.sortbtn .arrow{color:var(--muted);font-size:11px;margin-left:2px}
.colf{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid transparent;border-radius:5px;background:none;color:#9098A8;padding:0}
.colf:hover{border-color:var(--line);color:var(--ink);background:#fff}
.colf.on{background:var(--hivis);color:var(--ink);border-color:#D9A600}
.colf.open{outline:2px solid var(--ink)}
tbody td{padding:7px 8px;border-bottom:1px solid #EEECE6;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:#FFF8DC}
tfoot td{position:sticky;bottom:0;background:#EFEDE7;border-top:2px solid var(--ink);padding:8px;font-weight:600;white-space:nowrap}
td.neg{color:var(--stop)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12.5px;background:#E9ECF3}
.tag.bad{background:#FBE3E3;color:#8E1B1B}.tag.warn{background:var(--hivis-soft)}.tag.good{background:#DDF1E6;color:#16603C}
.more{padding:12px;text-align:center}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* filter panel */
.colpop{position:fixed;z-index:60;width:252px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(22,33,58,.2);font-size:14px}
.cp-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 7px;border-bottom:1px solid var(--line)}
.cp-head b{font-size:13px}
.cp-head button{background:none;border:0;font-size:14px}
.cp-body{padding:8px 12px 10px;max-height:300px;overflow:auto}
.cp-body input[type=text],.cp-body input[type=search],.cp-body input[type=date],.cp-body select{width:100%;height:29px;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.cp-row{display:flex;gap:6px;align-items:center}.cp-row select{flex:0 0 96px;width:96px}.cp-row input{flex:1 1 auto;min-width:0}
.cp-range{display:flex;gap:8px}.cp-range label{flex:1;font-size:12.5px;color:var(--muted)}
.cp-sub{margin:8px 0 5px;color:var(--muted);font-size:12.5px}
.cp-list{margin-top:6px;max-height:150px;overflow:auto;border:1px solid #EEECE6;border-radius:6px}
.cp-item{display:flex;align-items:center;gap:8px;padding:4px 8px;cursor:pointer}
.cp-item:hover{background:var(--zebra)}
.cp-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-item small{color:var(--muted)}
.cp-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cp-chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:13px}
.cp-chip:hover{border-color:var(--ink)}
.cp-foot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.cp-foot span{flex:1}
.cp-auto{display:flex;align-items:center;gap:6px;padding:0 12px 9px;font-size:13px;color:var(--muted)}
.note{color:var(--muted);font-size:13px}

/* setup */
.card{max-width:420px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
.card h1{font:700 28px/1 var(--cond);margin:0 0 12px}
.card label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.card input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 10px}
.card .btn{width:100%;height:42px;margin-top:16px}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;max-width:420px;padding:12px 14px;border-radius:6px;background:var(--ink);color:#fff}
.toast.err{background:var(--stop)}

/* dashboard */
.dash{padding:0 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card2{background:#fff;border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:6px;padding:14px;text-align:left;cursor:pointer}
.card2.warn{border-left-color:var(--hivis)}.card2.bad{border-left-color:var(--stop)}
.card2 b{display:block;font:700 30px/1.05 var(--cond);margin:2px 0}
.card2 span{font-size:13.5px;color:var(--muted)}
.card2.wide{grid-column:1/-1;cursor:default}
.dash h3{grid-column:1/-1;margin:10px 0 0;font:700 18px/1 var(--cond);color:var(--muted)}
/* row actions, forms */
.act{height:26px;border:1px solid var(--ink);background:#fff;border-radius:5px;padding:0 8px;font-size:12.5px;font-weight:600;margin-right:4px}
.act.warn{border-color:var(--stop);color:var(--stop)}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(22,33,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal{background:#fff;border-radius:10px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:880px}
.modal h2{font:700 24px/1 var(--cond);margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mb{padding:14px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.modal textarea{height:72px;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.olines td{padding:4px}.olines input,.olines select{height:32px}
#printArea{display:none}
@media print{
  body.lbl-printing>*:not(#printArea){display:none!important}
  body.lbl-printing #printArea{display:block}
  .lbl{box-sizing:border-box;overflow:hidden;page-break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--sans);color:#000}
  .lbl svg{max-width:100%}
  .lbl .t1{font-weight:600;font-size:10pt;line-height:1.1;max-height:2.3em;overflow:hidden}
  .lbl .t2{font-size:8pt}
  .lbl.bin .t1{font:700 22pt/1 var(--cond)}
  .sheet{display:grid;grid-template-columns:repeat(3,1fr)}
  .sheet .lbl{height:33.9mm;padding:2mm;border:0}
  .roll .lbl{width:50mm;height:25mm;padding:1mm;page-break-after:always}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  nav{padding:10px 0;overflow:visible;position:relative;z-index:30}
  nav .brand{padding-bottom:0}
  nav .menubtn{display:block}
  nav .navbody{display:none}
  .app.menu-open nav .navbody{display:block;position:absolute;left:0;right:0;top:100%;max-height:calc(100dvh - 64px);overflow:auto;overscroll-behavior:contain;
    background:var(--ink);padding:8px 0 16px;box-shadow:0 18px 30px rgba(10,18,40,.35)}
  .head{padding:14px}.tablewrap{margin:0 10px 14px}.chipbar{padding:0 14px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
/* ======================================================================
   Warehouse Office — reports with column filters.
   Same Supabase project and login as the scanner app (wms-scanner.html).
   Every column heading has a funnel: text (has / does not have + pick
   values), numbers (from / to), dates (quick ranges + from / to),
   yes/no. Filters show as chips above the table; export gives the
   filtered rows in Excel.
   ====================================================================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const isoToday = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const INR = new Intl.NumberFormat('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const QTY = new Intl.NumberFormat('en-IN', {maximumFractionDigits:3});
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = v => { if (!v) return ''; const s = String(v).slice(0,10).split('-'); return s.length === 3 ? `${s[2]} ${MON[+s[1]-1]} ${s[0]}` : v; };
const fmtTime = v => v ? fmtDate(v) + ' ' + String(v).slice(11,16) : '';

function fyRange(offset=0){
  const d = new Date(), y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  return [`${y+offset}-04-01`, `${y+offset+1}-03-31`];
}
function quickRange(v){
  const now = new Date(), iso = d => d.toISOString().slice(0,10), y = now.getFullYear(), m = now.getMonth(), qm = Math.floor(m/3)*3;
  if (v === 'month')   return [iso(new Date(Date.UTC(y, m, 1))), iso(new Date(Date.UTC(y, m+1, 0)))];
  if (v === 'last')    return [iso(new Date(Date.UTC(y, m-1, 1))), iso(new Date(Date.UTC(y, m, 0)))];
  if (v === 'quarter') return [iso(new Date(Date.UTC(y, qm, 1))), iso(new Date(Date.UTC(y, qm+3, 0)))];
  if (v === 'fy')      return fyRange(0);
  if (v === 'lastfy')  return fyRange(-1);
  return ['', ''];
}

/* ---------- labels for codes ---------- */
const DOC_LABEL = {opening:'Opening stock', grn:'Goods receipt', purchase_return:'Purchase return', sales_invoice:'Sales invoice',
  sales_return:'Sales return', transfer:'Transfer', adjustment_in:'Adjustment (add)', adjustment_out:'Adjustment (remove)'};
const MSME_LABEL = {overdue:'Overdue', due_within_7_days:'Due in 7 days', ok:'Within time', paid_late:'Paid late', paid_on_time:'Paid on time'};
const TABLE_LABEL = {items:'Items', item_gst_rates:'GST rates', item_barcodes:'Barcodes', parties:'Parties', warehouses:'Warehouses',
  locations:'Bins', documents:'Documents', document_lines:'Document lines', company_settings:'Company settings',
  role_backdate_limits:'Back-date limits', tenant_users:'Team', supplier_bills:'Supplier bills', supplier_payments:'Payments',
  bill_allocations:'Bill settlements', stock_reservations:'Reservations', item_reorder_levels:'Reorder levels', sales_points:'Counters', tenants:'Company'};
const ACTION_LABEL = {INSERT:'Created', UPDATE:'Changed', DELETE:'Deleted'};
const STATUS_LABEL = {draft:'Draft', posted:'Posted', cancelled:'Cancelled', confirmed:'Confirmed', closed:'Closed',
  open:'To pick', picked:'To pack', packed:'Ready to bill', invoiced:'Billed', counting:'Counting', submitted:'Awaiting approval', approved:'Approved'};
const cap = s => STATUS_LABEL[s] || s;

/* ---------- column builders ----------
   type: text | cat (pick from list) | num | money | date | time | bool
   sum:  total in the footer                                         */
const T = (k, label, o={}) => ({k, label, type:'text', ...o});
const C = (k, label, o={}) => ({k, label, type:'cat', ...o});
const N = (k, label, o={}) => ({k, label, type:'num', ...o});
const M = (k, label, o={}) => ({k, label, type:'money', sum:true, ...o});
const D = (k, label, o={}) => ({k, label, type:'date', ...o});
const Y = (k, label, o={}) => ({k, label, type:'bool', ...o});
const gstCols = [M('taxable_value','Taxable value'), M('igst','IGST'), M('cgst','CGST'), M('sgst','SGST'), M('cess','Cess')];

/* ---------- reports ----------
   src: view / table, rpc: function with params, range: server-side date
   column (with from / to in the toolbar), prep: add display columns   */
const REPORTS = [
  {group:'Home', id:'dashboard', title:'Dashboard', custom:true, cols:[], sort:['none','asc']},
  {group:'Stock', id:'bins', title:'Stock by bin', src:'v_stock_by_location', sort:['item_name','asc'],
   cols:[T('item_name','Item'), T('sku','SKU'), C('warehouse','Warehouse'), C('bin','Bin'), N('qty_on_hand','Qty', {sum:true}), M('stock_value','Value')]},
  {group:'Stock', id:'summary', title:'Stock summary', rpc:'stock_summary', params:'period', sort:['item_name','asc'],
   note:'Opening, inward, outward and closing for the period. Value is at cost (FIFO).',
   cols:[T('item_name','Item'), T('sku','SKU'), C('hsn_code','HSN'), C('warehouse','Warehouse'), N('opening','Opening', {sum:true}),
         N('inward','Inward', {sum:true}), N('outward','Outward', {sum:true}), N('closing','Closing', {sum:true}), M('closing_value','Closing value')]},
  {group:'Stock', id:'ledger', title:'Item ledger', src:'v_item_ledger', range:'movement_date', sort:['movement_date','asc'],
   note:'Every stock movement with the running balance for that item and warehouse.',
   prep:r => ({...r, doc_label:DOC_LABEL[r.doc_type] || r.doc_type}),
   cols:[D('movement_date','Date'), C('doc_label','Type'), T('doc_no','Document'), T('item_name','Item'), T('sku','SKU'), C('warehouse','Warehouse'),
         C('bin','Bin'), T('party','Party'), T('original_vendor','Original vendor'), N('qty_in','In', {sum:true}), N('qty_out','Out', {sum:true}),
         N('running_balance','Balance'), N('unit_cost','Cost'), M('value','Value'), Y('is_negative_draw','Went negative')]},
  {group:'Stock', id:'available', title:'Available stock', src:'v_available_stock', sort:['item_name','asc'],
   prep:r => ({...r, ...itemOf(r.item_id), warehouse:whOf(r.warehouse_id)}),
   cols:[T('item_name','Item'), T('sku','SKU'), C('warehouse','Warehouse'), N('qty_on_hand','On hand', {sum:true}), N('qty_reserved','Held for orders', {sum:true}), N('qty_available','Available', {sum:true})]},
  {group:'Stock', id:'ageing', title:'Stock ageing', src:'v_stock_ageing', sort:['age_days','desc'],
   prep:r => ({...r, warehouse:whOf(r.warehouse_id), bin:binOf(r.location_id), vendor:partyOf(r.vendor_id)}),
   cols:[T('item_name','Item'), T('sku','SKU'), C('warehouse','Warehouse'), C('bin','Bin'), C('vendor','Vendor'), T('batch_no','Batch'),
         D('expiry_date','Expiry'), D('inward_date','Received'), N('age_days','Age (days)'), C('age_bucket','Age group'), N('qty','Qty', {sum:true}), M('stock_value','Value')]},
  {group:'Stock', id:'vendorstock', title:'Vendor-wise stock', src:'v_vendor_stock', sort:['vendor','asc'],
   prep:r => ({...r, warehouse:whOf(r.warehouse_id), vendor:r.vendor || 'No vendor'}),

  sb:null, user:null, tenants:[], tenant:null, role:null,
  lk:{wh:{}, loc:{}, party:{}, item:{}, user:{}, bc:{}, parties:[], items:[], units:[], whs:[], pls:[], locs:[]},
  rep:null, rows:[], loading:false,
  f:{}, sort:null, q:'', limit:300,
  params:{from:fyRange(0)[0], to:isoToday()},
  pop:null, auto:LS.get('wms.colAuto', false)
};

const binOf = id => S.lk.loc[id] || '';
const partyOf = id => S.lk.party[id] || '';
const itemOf = id => S.lk.item[id] || {item_name:'', sku:''};
const userOf = id => id ? (S.lk.user[id] || 'Other user') : 'System';
function diffOf(r){
  if (r.action !== 'UPDATE' || !r.old_data || !r.new_data) return '';
  return Object.keys(r.new_data).filter(k => JSON.stringify(r.new_data[k]) !== JSON.stringify(r.old_data[k]) && !/_at$/.test(k))
    .map(k => `${k}: ${short(r.old_data[k])} → ${short(r.new_data[k])}`).join('; ');
}
const short = v => { const s = v === null || v === undefined ? 'blank' : String(v); return s.length > 24 ? s.slice(0, 22) + '…' : s; };

let toastT;
function toast(m, kind=''){ const t = $('#toast'); t.textContent = m; t.className = 'toast ' + kind; clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), kind ? 6000 : 2500); }

function viewSetup(){
  const c = wmsCfg();
  $('#root').innerHTML = `<div class="card"><h1>Server settings</h1>
    <p class="note">Only change this if you are moving to another Supabase project.</p>
    <label for="u">Project URL</label><input id="u" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co">
    <label for="k">Anon (public) key</label><input id="k" value="${esc(c.key)}">
    <button class="btn primary" id="go">Connect</button> <button class="btn" id="dflt">Use built-in server</button> <button class="btn" id="back">Back</button></div>`;
  $('#dflt').onclick = () => { LS.del('wms.cfg'); boot(); };
  $('#back').onclick = () => boot();
  $('#go').onclick = () => { const url = $('#u').value.trim().replace(/\/$/, ''), key = $('#k').value.trim();
    if (!/^https:\/\//.test(url) || key.length < 20) return toast('Enter the project URL and anon key.', 'err');
    LS.set('wms.cfg', {url, key}); boot(); };
}
function viewLogin(){
  $('#root').innerHTML = `<div class="card"><h1>Sign in</h1>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn primary" id="go">Sign in</button>
    <p class="note">New here? <button class="linkbtn" id="su">Create an account</button> with this email and password.<br>
    <button class="linkbtn" id="chg">Server settings</button></p></div>`;
  const go = async () => { const {error} = await S.sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
    if (error) return toast(error.message, 'err'); afterLogin(); };
  $('#su').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    if (!email || password.length < 8) return toast('Enter your email and a password of at least 8 characters.', 'err');
    const {data, error} = await S.sb.auth.signUp({email, password});
    if (error) return toast(error.message, 'err');
    if (data.session) afterLogin(); else toast('Account created. Open the link in the email we sent, then sign in.');
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#chg').onclick = () => viewSetup();
}
async function boot(){
  const c = wmsCfg();
  if (!window.supabase) return toast('Could not load the Supabase library. Check the internet connection and reload.', 'err');
  S.sb = window.supabase.createClient(c.url, c.key);
  const {data} = await S.sb.auth.getSession();
  if (!data.session) return viewLogin();
  afterLogin();
}
async function afterLogin(){
  const {data:{user}} = await S.sb.auth.getUser(); if (!user) return viewLogin();
  S.user = user;
  const {data, error} = await S.sb.from('tenant_users').select('tenant_id, role, tenants(name)').eq('user_id', user.id).eq('is_active', true);
  if (error) return toast(error.message, 'err');
  S.tenants = (data || []).map(r => ({id:r.tenant_id, role:r.role, name:r.tenants?.name || 'Company'}));
  if (!S.tenants.length) return viewNewCompany();
  const ctx = LS.get('wms.ctx', {});
  await useTenant(S.tenants.find(t => t.id === ctx.tenant) || S.tenants[0]);
}
async function useTenant(t){
  S.tenant = t.id; S.role = t.role;
  LS.set('wms.ctx', {...LS.get('wms.ctx', {}), tenant:t.id});
  await loadLookups();
  let hash = location.hash.slice(1);
  if (hash === 'tallyauto'){ LS.set('wms.auto.here.' + S.tenant, true); hash = 'tallysync'; }   // opened by the Tally Bridge at sign-in
  openReport(REPORTS.find(r => r.id === hash) || REPORTS[0]);
  autoStart();
}
async function loadLookups(){
  const t = {id:S.tenant};
  const q = (tbl, cols) => S.sb.from(tbl).select(cols).eq('tenant_id', t.id).limit(10000);

async function openReport(rep){
  S.rep = rep; S.f = LS.get('wms.f.' + rep.id, {}); S.sort = {k:rep.sort[0], dir:rep.sort[1]}; S.q = ''; S.limit = 300; S.pop = null;
  if (rep.params === 'fy'){ const [a, b] = fyRange(0); S.params = {from:a, to:b}; }
  else if (rep.params === 'period' || rep.range){ S.params = {from:fyRange(0)[0], to:isoToday()}; }
  location.hash = rep.id; rememberTab(rep.id);
  const mn = document.querySelector('main'); if (mn) mn.scrollTop = 0;
  await load();
}
async function load(){
  const rep = S.rep; S.loading = true; S.rows = []; render();
  if (rep.custom){
    const [{data, error}, ex] = await Promise.all([S.sb.rpc('dashboard_summary', {p_tenant:S.tenant}), S.sb.rpc('dashboard_extra', {p_tenant:S.tenant})]);
    if (error) toast(error.message, 'err');
    S.dash = {...(data || {}), ...((ex && ex.data) || {})}; S.loading = false; render(); return;
  }
  try{
    let rows = [];
    if (rep.rpc){
      const args = rep.rpcArgs ? rep.rpcArgs() : rep.params === 'fy' ? {p_tenant:S.tenant, p_fy_start:S.params.from, p_fy_end:S.params.to}
                                        : {p_tenant:S.tenant, p_from:S.params.from, p_to:S.params.to};
      const {data, error} = await S.sb.rpc(rep.rpc, args); if (error) throw error; rows = data || [];
    } else {
      const size = 1000, cap = 50000;
      for (let from = 0; from < cap; from += size){
        let q = S.sb.from(rep.src).select('*').eq(rep.tenantCol || 'tenant_id', S.tenant);
        if (rep.range){
          q = q.gte(rep.range, S.params.from).lte(rep.range, rep.range === 'at' ? S.params.to + 'T23:59:59.999+05:30' : S.params.to);
        }
        const {data, error} = await q.range(from, from + size - 1); if (error) throw error;
        rows.push(...data); if (data.length < size) break;
      }
    }
    S.rows = rep.prep ? rows.map(rep.prep) : rows;
  }catch(e){ toast(e.message || 'Could not load this report.', 'err'); }
  S.loading = false; render();
}

/* ---------- filtering ---------- */
const colOf = k => S.rep.cols.find(c => c.k === k);
const shown = (c, r) => {
  const v = r[c.k];
  if (c.type === 'bool') return v ? 'Yes' : 'No';
  if (c.type === 'date') return fmtDate(v);
  if (c.type === 'time') return fmtTime(v);
  return v === null || v === undefined ? '' : String(v);
};
const words = s => String(s || '').toLowerCase().split(',').map(x => x.trim()).filter(Boolean);
function isOn(f){ return !!f && Object.values(f).some(v => Array.isArray(v) ? v.length : v !== '' && v !== null && v !== undefined && v !== false); }

function passCol(c, f, r){
  if (!isOn(f)) return true;
  const v = r[c.k];
  if (c.type === 'text' || c.type === 'cat'){
    const txt = shown(c, r), low = txt.toLowerCase();
    if (f.vals && f.vals.length && !f.vals.includes(txt || '(blank)')) return false;
    if (f.has){ const hit = words(f.has).some(w => low.includes(w)); if (f.not ? hit : !hit) return false; }
    if (f.blank === 'blank' && txt) return false;
    if (f.blank === 'filled' && !txt) return false;
    return true;
  }
  if (c.type === 'num' || c.type === 'money'){
    if (f.min !== '' && f.min !== undefined && (v === null || num(v) < num(f.min))) return false;
    if (f.max !== '' && f.max !== undefined && (v === null || num(v) > num(f.max))) return false;
    if (f.nonzero && !num(v)) return false;
    return true;
  }
  if (c.type === 'date' || c.type === 'time'){
    const d = v ? String(v).slice(0, 10) : '';
    if (f.from && (!d || d < f.from)) return false;
    if (f.to && (!d || d > f.to)) return false;
    return true;
  }
  if (c.type === 'bool'){ if (f.v === 'yes' && !v) return false; if (f.v === 'no' && v) return false; }
  return true;
}
function filtered(exceptKey){
  const cols = S.rep.cols, q = S.q.trim().toLowerCase();
  return S.rows.filter(r => {
    for (const c of cols){ if (c.k !== exceptKey && !passCol(c, S.f[c.k], r)) return false; }
    if (q && !cols.some(c => shown(c, r).toLowerCase().includes(q))) return false;
    return true;
  });
}
function sorted(rows){
  const s = S.sort, c = s && colOf(s.k); if (!c) return rows;
  const dir = s.dir === 'desc' ? -1 : 1, isNum = c.type === 'num' || c.type === 'money';
  return rows.slice().sort((a, b) => {
    const x = a[c.k], y = b[c.k];
    if (x === y) return 0; if (x === null || x === undefined || x === '') return 1; if (y === null || y === undefined || y === '') return -1;
    return (isNum ? num(x) - num(y) : String(x).localeCompare(String(y), 'en-IN', {numeric:true})) * dir;
  });
}
// values available in a column, counted over rows that pass the OTHER filters (like Excel)
function colValues(k){
  const c = colOf(k), m = new Map();
  filtered(k).forEach(r => { const v = shown(c, r) || '(blank)'; m.set(v, (m.get(v) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'en-IN', {numeric:true}));
}

/* ---------- chips ---------- */
function chipText(c, f){
  const money = v => c.type === 'money' ? '₹' + INR.format(num(v)) : QTY.format(num(v));
  if (c.type === 'text' || c.type === 'cat'){
    const parts = [];
    if (f.has) parts.push(`${c.label} ${f.not ? 'does not have' : 'has'} “${f.has}”`);
    if (f.vals && f.vals.length) parts.push(`${c.label}: ${f.vals.slice(0, 2).join(', ')}${f.vals.length > 2 ? ' +' + (f.vals.length - 2) : ''}`);
    if (f.blank) parts.push(`${c.label} ${f.blank === 'blank' ? 'is blank' : 'is filled'}`);
    return parts.join('; ');
  }
  if (c.type === 'num' || c.type === 'money'){
    const has = x => x !== '' && x !== undefined;
    const r = has(f.min) && has(f.max) ? `${money(f.min)} to ${money(f.max)}` : has(f.min) ? `≥ ${money(f.min)}` : has(f.max) ? `≤ ${money(f.max)}` : '';
    return [r ? `${c.label} ${r}` : '', f.nonzero ? `${c.label} not zero` : ''].filter(Boolean).join('; ');
  }
  if (c.type === 'date' || c.type === 'time')
    return `${c.label} ${f.from && f.to ? fmtDate(f.from) + ' to ' + fmtDate(f.to) : f.from ? 'from ' + fmtDate(f.from) : 'up to ' + fmtDate(f.to)}`;
  if (c.type === 'bool') return `${c.label}: ${f.v === 'yes' ? 'Yes' : 'No'}`;
  return c.label;
}
function chipBar(nShown){
  const chips = S.rep.cols.filter(c => isOn(S.f[c.k])).map(c => [c.k, chipText(c, S.f[c.k])]);
  if (S.q) chips.unshift(['__q', `Any column has “${S.q}”`]);
  if (!chips.length) return `<div class="chipbar"><span class="count">${QTY.format(nShown)} rows</span></div>`;
  return `<div class="chipbar"><span class="count">${QTY.format(nShown)} of ${QTY.format(S.rows.length)} rows</span>` +
    chips.map(([k, l]) => `<span class="fchip"><button class="fchip-l" data-colf="${k}">${esc(l)}</button><button class="fchip-x" data-chipx="${k}" aria-label="Remove this filter">✕</button></span>`).join('') +
    `<button class="linkbtn" data-chipall>Clear all</button></div>`;
}

function readPop(){
  const pop = $('#colpop'), p = S.pop; if (!pop || !p) return;
  const d = {...p.draft};
  pop.querySelectorAll('[data-pf]').forEach(el => {
    const k = el.dataset.pf;
    if (el.type === 'checkbox') d[k] = el.checked;
    else if (el.type === 'radio'){ if (el.checked) d[k] = el.value; }
    else d[k] = k === 'not' ? el.value === '1' : el.value.trim();
  });
  const vis = [...pop.querySelectorAll('[data-pv]')];
  if (vis.length){
    const keep = (d.vals || []).filter(v => !vis.some(el => el.value === v));   // chosen values hidden by the search stay chosen
    d.vals = keep.concat(vis.filter(el => el.checked).map(el => el.value));
  }
  if (d.from && d.to && d.from > d.to){ const x = d.from; d.from = d.to; d.to = x; }
  p.draft = d;
}
function applyPop(close){

  S.f[p.k] = p.draft; if (!isOn(S.f[p.k])) delete S.f[p.k];

function placePop(){
  const pop = $('#colpop'); if (!pop || !S.pop) return;
  const btn = document.querySelector(`.colf[data-colf="${S.pop.k}"]`);
  if (!btn){ pop.style.left = '50%'; pop.style.top = '120px'; pop.style.transform = 'translateX(-50%)'; }
  else {
    pop.style.transform = '';
    const cellEl = btn.closest('th') || btn, cellR = cellEl.getBoundingClientRect();
    const body = pop.querySelector('.cp-body'), head = pop.querySelector('.cp-head'), foot = pop.querySelector('.cp-foot'), auto = pop.querySelector('.cp-auto');
    const chrome = (head ? head.offsetHeight : 0) + (foot ? foot.offsetHeight : 0) + (auto ? auto.offsetHeight : 0) + 8;
    const below = window.innerHeight - cellR.bottom - 20, above = cellR.top - 20;
    const down = below >= 260 || below >= above;                  // downwards when there is room, as a spreadsheet does
    if (body) body.style.maxHeight = Math.max(150, Math.min(360, (down ? below : above) - chrome)) + 'px';
    const w = pop.offsetWidth, h = pop.offsetHeight;
    // under the column, aligned to its left edge; to its right edge when that would run off the screen
    let left = cellR.left;
    if (left + w > window.innerWidth - 12) left = Math.max(12, cellR.right - w);
    left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
    const top = down ? Math.min(cellR.bottom + 4, window.innerHeight - h - 12) : Math.max(12, cellR.top - h - 4);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  const lst = pop.querySelector('.cp-list'); if (lst && S.pop.scroll) lst.scrollTop = S.pop.scroll;
  if (S.pop.focus){ const el = pop.querySelector(S.pop.focus); if (el){ el.focus(); const v = el.value; if (el.setSelectionRange && el.type !== 'date') el.setSelectionRange(v.length, v.length); } S.pop.focus = null; }
  else if (S.pop.justOpened){ S.pop.justOpened = false; const first = pop.querySelector('input[type=text],input[type=search],input[type=date]'); if (first) first.focus(); }
}

/* ---------- render ---------- */
function cell(c, r){
  const v = r[c.k];
  if (c.type === 'money') return v === null || v === undefined ? '' : INR.format(num(v));
  if (c.type === 'num') return v === null || v === undefined ? '' : QTY.format(num(v));
  if (c.type === 'bool') return v ? 'Yes' : '';
  const s = shown(c, r);
  if (/^(Overdue|Missing|Disallowed|Dead|Cancelled|Expired)/.test(s)) return `<span class="tag bad">${esc(s)}</span>`;
  if (/^(Due in 7 days|Slow|Paid late|Allowed only|Near expiry|Awaiting approval|Partly done|Draft)/.test(s)) return `<span class="tag warn">${esc(s)}</span>`;
  if (/^(Generated|Paid on time|Within time|Done|Posted|Approved|Billed)$/.test(s)) return `<span class="tag good">${esc(s)}</span>`;
  return esc(s);
}

    .filter(it => it.tabs.length)]).filter(([, items]) => items.length);
  const extra = REPORTS.filter(r => !seen.has(r.id) && !NAV.some(([g, its]) => hide.includes(g) && its.some(it => it.tabs.some(t => t[0] === r.id)))
                                  && !NAV.some(([, its]) => its.some(it => hide.includes(it.key) && it.tabs.some(t => t[0] === r.id))));
  if (extra.length) list.push(['More', extra.map(r => ({t:r.title, section:'More', tabs:[{id:r.id, label:r.title, rep:r}]}))]);   // nothing ever disappears
  S._nav = {role:S.role, list};
  return list;
}
const navItemOf = id => { for (const [, items] of navSections()) { const it = items.find(i => i.tabs.some(t => t.id === id)); if (it) return it; } return null; };
function navOpenSet(){
  if (!S.navOpen) S.navOpen = new Set(LS.get('wms.nav2', NAV.map(g => g[0]).concat('More')));
  return S.navOpen;
}
function navHtml(rep){
  const open = navOpenSet(), curItem = navItemOf(rep.id), cur = curItem && curItem.section;
  if (cur) open.add(cur);
  const q = (S.navq || '').trim().toLowerCase(), lastTab = LS.get('wms.tab', {});
  const tabHit = it => it.tabs.find(t => (t.label + ' ' + t.rep.title).toLowerCase().includes(q));
  const html = navSections().map(([g, items]) => {
    const links = [];
    for (const it of items){
      if (q){
        // match the screen name, its section, or any of its tabs ("hsn" finds GSTR-1 > HSN summary)
        const tab = tabHit(it);
        const whole = it.t.toLowerCase().includes(q);
        if (!tab && !whole) continue;
        const target = tab || it.tabs[0];
        links.push(`<a href="#${target.id}" data-rep="${target.id}">${esc(it.t)}${tab && it.tabs.length > 1 ? `<span class="sub"> › ${esc(tab.label)}</span>` : ''}</a>`);
      } else {
        const target = it.tabs.find(t => t.id === lastTab[it.tabs[0].id]) || it.tabs[0], on = it === curItem;
        links.push(`<a href="#${target.id}" data-rep="${target.id}" class="${on ? 'on' : ''}"${on ? ' aria-current="page"' : ''}>${esc(it.t)}</a>`);
      }
    }
    if (!links.length) return '';
    const isOpen = q ? true : open.has(g), gid = 'ng-' + g.replace(/\W+/g, '');
    return `<button class="ng${g === cur ? ' has-on' : ''}" data-grp="${esc(g)}" aria-expanded="${isOpen}" aria-controls="${gid}">
        <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>${esc(g)}</button>
      <div class="grp" id="${gid}" ${isOpen ? '' : 'hidden'}>${links.join('')}</div>`;
  }).join('');
  return html || `<div class="nonav">No screen matches “${esc(S.navq)}”.</div>`;
}
function tabsHtml(rep){
  const it = navItemOf(rep.id);
  if (!it || it.tabs.length < 2) return '';
  return `<div class="tabs" role="tablist" aria-label="${esc(it.t)}">${it.tabs.map(t =>
    `<a href="#${t.id}" role="tab" data-rep="${t.id}" aria-selected="${t.id === rep.id}" class="${t.id === rep.id ? 'on' : ''}">${esc(t.label)}</a>`).join('')}</div>`;
}
function rememberTab(id){
  const it = navItemOf(id); if (!it || it.tabs.length < 2) return;
  const m = LS.get('wms.tab', {}); m[it.tabs[0].id] = id; LS.set('wms.tab', m);
}
function toggleNavGroup(g){
  const open = navOpenSet();
  open.has(g) ? open.delete(g) : open.add(g);
  LS.set('wms.nav2', [...open]);
  const b = [...document.querySelectorAll('nav [data-grp]')].find(x => x.dataset.grp === g);
  if (b){ const on = open.has(g); b.setAttribute('aria-expanded', on); document.getElementById(b.getAttribute('aria-controls')).hidden = !on; }
}

/* ---------- actions ---------- */
const draftNo = () => 'DRAFT-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
async function nextNo(prefix, table='documents', col='doc_no', docType=null){
  let q = S.sb.from(table).select(col).eq('tenant_id', S.tenant).like(col, prefix + '%').order('created_at', {ascending:false}).limit(1);
  if (docType) q = q.eq('doc_type', docType);
  const {data, error} = await q; if (error) throw error;
  const n = parseInt(((data[0]?.[col] || '').match(/(\d+)$/) || [0, 0])[1], 10) + 1;
  return prefix + String(n).padStart(5, '0');
}
async function postDoc(id, no, quiet){
  let neg = false, warn = false, error = null;
  for (let i = 0; i < 3; i++){
    ({error} = await S.sb.rpc('post_document', {p_doc_id:id, p_confirm_negative:neg, p_confirm_warnings:warn}));
    if (!error) break;
    if (error.hint === 'WARNINGS_CONFIRM' && !warn && confirm(error.message + '\n\nPost anyway?')){ warn = true; continue; }
    if (error.hint === 'NEGATIVE_STOCK_CONFIRM' && !neg && confirm(error.message + '\n\nPost anyway?')){ neg = true; continue; }
    break;
  }
  if (error && error.hint === 'APPROVAL_REQUIRED'){ askApproval(error.message, {p_doc:id, p_action:'post'}); return false; }
  if (error){ toast(`Saved as a draft, not posted. ${error.message}`, 'err'); if (!quiet) load(); return false; }
  const {data:fin} = await S.sb.from('documents').select('doc_no').eq('id', id).single();
  toast(`${fin ? fin.doc_no : no} posted.`); if (!quiet) load(); return true;
}
async function rpcAct(fn, args, msg){
  const {data, error} = await S.sb.rpc(fn, args);
  if (error) return toast(error.message, 'err');
  toast(msg ? msg(data) : 'Done.'); load();
}
async function tableAct(table, id, patch){
  const {error} = await S.sb.from(table).update(patch).eq('id', id);
  if (error) return toast(error.message, 'err'); toast('Saved.'); load();
}
function closeModal(){ const m = $('.modal-bg'); if (m) m.remove(); }
function modal(title, body, okLabel, onOk, wide){
  closeModal();
  const el = document.createElement('div'); el.className = 'modal-bg';
  el.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="mb">${body}</div>
    <div class="mf"><button class="btn" data-mclose>Cancel</button><button class="btn primary" data-mok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(el);
  el.querySelector('[data-mclose]').onclick = closeModal;
  el.querySelector('[data-mok]').onclick = async () => {
    const b = el.querySelector('[data-mok]'); b.disabled = true;
    try{ const ok = await onOk(el); if (ok !== false) closeModal(); else b.disabled = false; }
    catch(e){ toast(e.message || String(e), 'err'); b.disabled = false; }
  };
  const f = el.querySelector('input,select,textarea'); if (f) f.focus();
  return el;
}
function askReason(title, label, okLabel, fn){
  modal(title, `<label for="mr">${esc(label)}</label><textarea id="mr"></textarea>`, okLabel, async el => {
    const v = el.querySelector('#mr').value.trim(); if (!v){ toast('Enter a reason.', 'err'); return false; }
    return fn(v);
  });
}
function cancelDoc(r){
  askReason(`Cancel ${r.doc_no}`, 'Why is it being cancelled? This is saved in the employee log.', 'Cancel document', async reason => {
    const {error} = await S.sb.rpc('cancel_document', {p_doc_id:r.id, p_reason:reason});
    if (error && error.hint === 'APPROVAL_REQUIRED'){ closeModal(); askApproval(error.message, {p_doc:r.id, p_action:'cancel', p_note:reason}); return; }
    if (error){ toast(error.message, 'err'); return false; }
    toast(`${r.doc_no} cancelled and stock reversed.`); load();
  });
}

function fieldHtml(f, v, row, locked){
  const id = 'f_' + f.k, val = v === null || v === undefined ? '' : v;
  if (locked) return `<label for="${id}">${esc(f.label)}</label><input id="${id}" value="${esc(f.type === 'select' ? ((typeof f.options === 'function' ? f.options(row) : f.options).find(o => String(o[0]) === String(val)) || [val, val])[1] : val)}" disabled data-raw="${esc(val)}">`;
  const help = f.help ? `<div class="note" style="margin-top:2px">${esc(f.help)}</div>` : '';
  if (f.type === 'check') return `<label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink)"><input type="checkbox" id="${id}" ${val ? 'checked' : ''} style="width:auto;height:auto"> ${esc(f.label)}</label>`;
  const lab = `<label for="${id}">${esc(f.label)}${f.req ? ' *' : ''}</label>`;
  if (f.type === 'select'){
    const o = typeof f.options === 'function' ? f.options(row) : f.options;
    return lab + `<select id="${id}">${o.map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(val) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>` + help;
  }
  if (f.type === 'textarea') return lab + `<textarea id="${id}">${esc(val)}</textarea>` + help;
  if (f.type === 'item'){
    const it = S.lk.items.find(i => i.id === val);
    return lab + `<input id="${id}" list="itemlist" value="${esc(it ? it.sku + ' | ' + it.name : '')}" placeholder="Type SKU or name">` + help;
  }
  const type = f.type === 'date' ? 'date' : 'text', mode = f.type === 'num' || f.type === 'int' ? ' inputmode="decimal"' : '';
  return lab + `<input id="${id}" type="${type}"${mode} value="${esc(val)}"${f.upper ? ' style="text-transform:uppercase"' : ''}>` + help;
}
function readField(f, el){
  const x = el.querySelector('#f_' + f.k); if (!x) return undefined;
  if (x.disabled && x.dataset.raw !== undefined) return x.dataset.raw;
  if (f.type === 'check') return x.checked;
  let v = x.value.trim();
  if (f.type === 'item'){ if (!v) return null; const it = S.lk.items.find(i => `${i.sku} | ${i.name}` === v || i.sku.toUpperCase() === v.toUpperCase()); return it ? it.id : '__bad'; }
  if (v === '') return null;
  if (f.upper) v = v.toUpperCase();
  if (f.type === 'num') return isFinite(+v) ? +v : NaN;
  if (f.type === 'int') return /^-?\d+$/.test(v) ? parseInt(v, 10) : NaN;
  return v;
}
function editForm(key, row, preset){
  const cfg = CRUD[key], isNew = !row;
  const fields = cfg.fields.filter(f => isNew || !f.createOnly);
  const base = row || {};
  const valOf = f => f.k in (preset || {}) ? preset[f.k] : isNew ? (typeof f.def === 'function' ? f.def() : f.def) : base[f.k];
  const el = modal(`${isNew ? 'Add' : 'Edit'} ${cfg.noun}`, `<datalist id="itemlist">${S.lk.items.map(i => `<option value="${esc(i.sku)} | ${esc(i.name)}"></option>`).join('')}</datalist>
    <div class="grid2">${fields.map(f => `<div${f.type === 'textarea' ? ' style="grid-column:1/-1"' : ''}>${fieldHtml(f, valOf(f), row, !isNew && (cfg.key || []).includes(f.k))}</div>`).join('')}</div>`,
    isNew ? `Add ${cfg.noun}` : 'Save', async el2 => {
      const v = {};
      for (const f of fields){
        const x = readField(f, el2);
        if (x === '__bad'){ toast(`Pick the ${f.label.toLowerCase()} from the list.`, 'err'); return false; }
        if (typeof x === 'number' && isNaN(x)){ toast(`${f.label} must be a number.`, 'err'); return false; }
        if (f.req && (x === null || x === undefined || x === '')){ toast(`Enter ${f.label.toLowerCase()}.`, 'err'); return false; }
        v[f.k] = x;
      }
      const bad = cfg.check && cfg.check(v); if (bad){ toast(bad, 'err'); return false; }
      if (cfg.before) cfg.before(v);
      const data = Object.fromEntries(Object.entries(v).filter(([k]) => !k.startsWith('_')));
      let res;
      if (isNew || cfg.upsert){
        data.tenant_id = S.tenant;
        res = cfg.upsert ? await S.sb.from(cfg.table).upsert(data, {onConflict:(cfg.key || ['id']).join(',')}).select()
                         : await S.sb.from(cfg.table).insert(data).select();
      } else {
        let q = S.sb.from(cfg.table).update(data);
        (cfg.key || ['id']).forEach(k => { q = q.eq(k, base[k]); });
        res = await q.select();
      }
      if (res.error){ toast(friendlyDbError(res.error), 'err'); return false; }
      if (!res.data || !res.data.length){ toast('Not saved. Your role cannot change this. Ask an owner, admin, manager or accountant.', 'err'); return false; }
      if (cfg.after) await cfg.after(res.data[0], v, isNew);
      toast(`${cfg.noun[0].toUpperCase() + cfg.noun.slice(1)} saved.`);
      await loadLookups(); load();
    }, true);
  const g = el.querySelector('#f_gstin'), st = el.querySelector('#f_state_code');
  if (g && st) g.addEventListener('input', () => { const x = g.value.toUpperCase(); if (/^\d{2}/.test(x) && st.querySelector(`option[value="${x.slice(0, 2)}"]`)) st.value = x.slice(0, 2); });
}
function friendlyDbError(e){
  const m = e.message || '';
  if (e.code === '23505') return 'This already exists. Use a different code or number, or edit the existing one.';
  if (/check constraint/.test(m)) return 'One of the values is not allowed. Check codes such as GSTIN, HSN and PIN.';
  if (/row-level security/.test(m)) return 'Your role cannot change this. Ask an owner, admin, manager or accountant.';
  return m;
}

function binCodes(el){
  const rng = s => { const m = String(s).trim().match(/^(\d+)\s*-\s*(\d+)$/) || String(s).trim().match(/^(\d+)$/);
    if (!m) return null; const a = +m[1], b = +(m[2] || m[1]); if (b < a || b - a > 200) return null; return Array.from({length:b - a + 1}, (_, i) => a + i); };
  const zones = el.querySelector('#gz').value.split(',').map(z => z.trim().toUpperCase()).filter(Boolean);
  const racks = rng(el.querySelector('#gr').value), shelves = rng(el.querySelector('#gs').value);
  const binsTxt = el.querySelector('#gb').value.trim(), bins = binsTxt ? rng(binsTxt) : [null];
  if (!zones.length || !racks || !shelves || !bins) return [];
  const pad = n => String(n).padStart(2, '0'), out = [];
  zones.forEach(z => racks.forEach(r => shelves.forEach(s => bins.forEach(b => out.push(`${z}-R${pad(r)}-S${s}${b === null ? '' : '-B' + pad(b)}`)))));
  return out;
}

const yes = v => /^(y|yes|true|1)$/i.test(String(v).trim());
function toISO(v){
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const s = String(v || '').trim(); if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return 'bad';
}
function importForm(kind){
  const cfg = IMPORTS[kind];
  const el = modal(`Import ${cfg.title} from Excel`, `
    <p class="note">Use the template so the column headings match. Columns marked * are needed.

    const ws = XLSX.utils.aoa_to_sheet([cfg.cols.map(c => c[0] + (c[2] ? ' *' : '')), cfg.cols.map(c => c[1])]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Import'); XLSX.writeFile(wb, `import_${kind}_template.xlsx`);
  };

      const norm = raw.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.replace(/\*/g, '').trim().toLowerCase(), typeof v === 'string' ? v.trim() : v])));

    }catch(err){ el.querySelector('#pv').textContent = 'Could not read that file. Save it as .xlsx and try again.'; }
  };
}
function validateImport(kind, rows){
  const ok = [], bad = [];
  rows.forEach((r, i) => {
    const row = i + 2, g = k => r[k] === undefined ? '' : r[k], n = k => g(k) === '' ? null : +g(k);
    const fail = msg => bad.push({row, msg});
    if (Object.values(r).every(v => v === '')) return;
    if (kind === 'items'){
      const sku = String(g('sku')).toUpperCase(), hsn = String(g('hsn')).replace(/\s/g, ''), gst = n('gst %'), from = toISO(g('gst from')) || '2017-07-01';
      if (!sku || !g('name')) return fail('SKU and name are needed.');
      if (!/^[0-9]{4,8}$/.test(hsn)) return fail(`HSN "${hsn}" should be 4 to 8 digits.`);
      if (gst === null || isNaN(gst) || gst < 0 || gst > 100) return fail('GST % is missing or wrong.');
      if (from === 'bad') return fail('GST from date is not a date.');
      const unit = String(g('unit') || 'NOS').toUpperCase();
      if (!UQC.includes(unit)) return fail(`Unit "${unit}" is not a GST UQC code.`);
      for (const k of ['mrp','purchase price','discount %']) if (g(k) !== '' && isNaN(+g(k))) return fail(`${k} is not a number.`);
      ok.push({sku, name:String(g('name')), hsn_code:hsn, uom:unit, mrp:n('mrp'), std_purchase_price:n('purchase price'),
        default_discount_pct:n('discount %') || 0, track_batch:yes(g('track batch')), track_expiry:yes(g('track expiry')), _gst:gst, _from:from, _barcode:String(g('barcode')).trim()});
    }
    if (kind === 'parties'){
      const type = String(g('type')).toLowerCase(), gstin = String(g('gstin')).toUpperCase().replace(/\s/g, '');
      let st = String(g('state code')).padStart(2, '0'); if (st === '00') st = gstin.slice(0, 2) || '';
      if (!g('name')) return fail('Name is needed.');
      if (!['supplier','customer','both'].includes(type)) return fail('Type should be supplier, customer or both.');
      if (gstin && !GSTIN_RE.test(gstin)) return fail(`GSTIN "${gstin}" does not look right.`);
      if (st && !STATES.some(x => x[0] === st)) return fail(`State code "${st}" is not valid.`);
      const cat = String(g('msme category')).toLowerCase(), act = String(g('msme activity')).toLowerCase();
      if (cat && !['micro','small','medium'].includes(cat)) return fail('MSME category should be micro, small or medium.');
      if (act && !['manufacturing','services','trading'].includes(act)) return fail('MSME activity should be manufacturing, services or trading.');
      if (S.lk.parties.some(p => p.name.toLowerCase() === String(g('name')).toLowerCase())) return fail(`"${g('name')}" already exists (skipped).`);
      ok.push({name:String(g('name')), party_type:type, gstin:gstin || null, state_code:st || null, is_msme:yes(g('msme')), msme_category:cat || null,
        msme_activity:act || null, udyam_no:String(g('udyam no')) || null, has_written_agreement:yes(g('written agreement')),
        credit_days:g('credit days') === '' ? null : parseInt(g('credit days'), 10), credit_limit:n('credit limit'), tally_ledger:String(g('tally ledger')) || null});
    }
    if (kind === 'price_list_items'){
      const it = S.lk.items.find(x => x.sku.toUpperCase() === String(g('sku')).toUpperCase()), from = toISO(g('from date'));
      if (!g('price list')) return fail('Price list name is needed.');
      if (!it) return fail(`SKU "${g('sku')}" is not in the item master.`);
      if (!from || from === 'bad') return fail('From date is missing or wrong.');
      if (g('rate') === '' && g('discount %') === '') return fail('Give a rate, a discount, or both.');
      ok.push({price_list:String(g('price list')), item_id:it.id, effective_from:from, min_qty:n('from qty') || 0, rate:n('rate'), discount_pct:n('discount %')});
    }
  });
  return {ok, bad};
}
async function runImport(kind, rows){
  const chunks = (a, n) => Array.from({length:Math.ceil(a.length / n)}, (_, i) => a.slice(i * n, i * n + n));
  if (kind === 'items'){
    let done = 0;
    for (const part of chunks(rows, 400)){
      const {data, error} = await S.sb.from('items').upsert(part.map(({_gst, _from, _barcode, ...x}) => ({...x, tenant_id:S.tenant})), {onConflict:'tenant_id,sku'}).select('id,sku');
      if (error) throw new Error(friendlyDbError(error));
      const id = Object.fromEntries(data.map(x => [x.sku, x.id]));
      const rates = part.map(x => ({tenant_id:S.tenant, item_id:id[x.sku], effective_from:x._from, gst_rate:x._gst}));
      const {error:e2} = await S.sb.from('item_gst_rates').upsert(rates, {onConflict:'item_id,effective_from', ignoreDuplicates:true});
      if (e2) throw new Error(friendlyDbError(e2));
      const bcs = part.filter(x => x._barcode).map(x => ({tenant_id:S.tenant, item_id:id[x.sku], barcode:x._barcode}));
      if (bcs.length){ const {error:e3} = await S.sb.from('item_barcodes').upsert(bcs, {onConflict:'tenant_id,barcode', ignoreDuplicates:true}); if (e3) throw new Error(friendlyDbError(e3)); }
      done += data.length;
    }
    return done;
  }
  if (kind === 'parties'){
    let done = 0;
    for (const part of chunks(rows, 400)){
      const {error} = await S.sb.from('parties').insert(part.map(x => ({...x, tenant_id:S.tenant})));
      if (error) throw new Error(friendlyDbError(error)); done += part.length;
    }
    return done;
  }
  if (kind === 'price_list_items'){
    const names = [...new Set(rows.map(r => r.price_list))];
    const missing = names.filter(nm => !S.lk.pls.some(p => p.name.toLowerCase() === nm.toLowerCase()));
    if (missing.length){
      const {error} = await S.sb.from('price_lists').insert(missing.map(nm => ({tenant_id:S.tenant, name:nm, list_type:'sales'})));
      if (error) throw new Error(friendlyDbError(error));
      await loadLookups();
    }
    const plId = nm => S.lk.pls.find(p => p.name.toLowerCase() === nm.toLowerCase()).id;
    let done = 0;
    for (const part of chunks(rows, 400)){
      const {error} = await S.sb.from('price_list_items').upsert(part.map(({price_list, ...x}) => ({...x, tenant_id:S.tenant, price_list_id:plId(price_list)})),
        {onConflict:'price_list_id,item_id,effective_from,min_qty'});
      if (error) throw new Error(friendlyDbError(error)); done += part.length;
    }
    return done;
  }
}

function download(name, text, type = 'application/json'){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const safeName = s => String(s).replace(/[^A-Za-z0-9-]+/g, '_');
async function gstOne(r, kind){
  const {data:miss, error} = await S.sb.rpc('gst_json_check', {p_doc:r.id, p_kind:kind});
  if (error) return toast(error.message, 'err');
  if (miss && miss.length){
    if (kind === 'ewaybill' && miss.every(m => /distance|vehicle/i.test(m))) { toast(miss.join(' ') + ' Enter them now.', 'err'); return gstRefsForm(r, true); }
    return toast(miss.join(' '), 'err');
  }
  const {data, error:e2} = await S.sb.rpc(kind === 'einvoice' ? 'einvoice_json' : 'ewaybill_json', {p_doc:r.id});
  if (e2) return toast(e2.message, 'err');
  const body = kind === 'einvoice' ? [data] : {version:'1.0.0621', billLists:[data]};
  download(`${kind === 'einvoice' ? 'einvoice' : 'ewaybill'}_${safeName(r.doc_no)}.json`, JSON.stringify(body, null, 2));
  toast('JSON downloaded. Upload it on the portal or send it through your GSP, then record the number here.');
}
async function gstBulk(kind){
  const rows = sorted(filtered()).filter(r => (r.status || 'posted') === 'posted');
  if (!rows.length) return toast('No posted rows shown.', 'err');
  if (rows.length > 100) return toast('Filter to 100 documents or fewer.', 'err');
  const ok = [], skipped = [];
  for (const r of rows){
    const id = r.id || r.doc_id;
    const {data:miss} = await S.sb.rpc('gst_json_check', {p_doc:id, p_kind:kind});
    if (miss && miss.length){ skipped.push(`${r.doc_no}: ${miss[0]}`); continue; }
    const {data} = await S.sb.rpc(kind === 'einvoice' ? 'einvoice_json' : 'ewaybill_json', {p_doc:id});
    if (data) ok.push(data);
  }
  if (ok.length) download(`${kind}_${isoToday()}_${ok.length}.json`, JSON.stringify(kind === 'einvoice' ? ok : {version:'1.0.0621', billLists:ok}, null, 2));
  toast(`${ok.length} document(s) in the file.${skipped.length ? ` ${skipped.length} skipped: ${skipped.slice(0, 3).join('; ')}` : ''}`, skipped.length ? 'err' : '');
}

async function bridgeCall(path, body){

async function tallyBuild(rowsIn){
  const rows = rowsIn || sorted(filtered());
  if (!rows.length){ if (!rowsIn) toast('Nothing to send.', 'err'); return null; }
  if (rows.length > 300){ toast('Filter to 300 entries or fewer at a time.', 'err'); return null; }
  if (!window.WMSTally){ toast('Tally module did not load. Keep wms-tally.js next to this page.', 'err'); return null; }
  const D = await WMSTally.load(S.sb, S.tenant, rows);
  const R = WMSTally.build(D, rows);
  for (const p of R.problems) await S.sb.from('tally_sync_log').insert({tenant_id:S.tenant, entity:p.row.entity, entity_id:p.row.entity_id, action:p.row.action, side:p.row.side, status:'failed', message:p.message});
  return R;
}
// Sends queue rows through the bridge and logs each result. Used by the button and by automatic sync.
async function pushRows(rows, quiet){
    const R = await tallyBuild(rows); if (!R) return null;
    let ok = 0, bad = R.problems.length, masterErr = [];
    for (const [company, part] of Object.entries(R.byCompany)){
      if (!quiet) toast(`Sending ${part.vouchers.length} entries to ${company}…`);
      const res = await bridgeCall('/import', {company, masters:part.masters, vouchers:part.vouchers.map((v, i) => ({id:'v' + i, xml:v.xml}))});
      (res.results || []).filter(x => x.kind === 'master' && !x.ok && !/exist/i.test(x.message || '')).forEach(x => masterErr.push(`${x.id.slice(2)}: ${x.message}`));
      const logs = part.vouchers.map((v, i) => {
        const x = (res.results || []).find(y => y.kind === 'voucher' && y.id === 'v' + i) || {ok:false, message:'No reply for this entry.'};
        if (x.ok) ok++; else bad++;
        return {tenant_id:S.tenant, entity:v.row.entity, entity_id:v.row.entity_id, action:v.row.action, side:v.row.side, status:x.ok ? 'ok' : 'failed',
                message:x.ok ? (x.verified === false ? 'Created; not read back' : 'Created') : (x.message || x.error), tally_company:company,
                voucher_no:x.vchNumber || v.voucherNo || null, guid:x.guid || null};
      });
      if (logs.length){ const {error} = await S.sb.from('tally_sync_log').insert(logs); if (error) toast(error.message, 'err'); }
    }
    return {ok, bad, masterErr};
}
async function tallySend(){
  const c = bridgeCfg(); if (!c.key) return bridgeConnect();
  try{
    const res = await pushRows(null, false); if (!res) return;
    const {ok, bad, masterErr} = res;
    toast(`${ok} entr${ok === 1 ? 'y' : 'ies'} in Tally.${bad ? ` ${bad} failed; see Last error.` : ''}${masterErr.length ? ' Masters not created: ' + masterErr.slice(0, 3).join('; ') : ''}`, bad || masterErr.length ? 'err' : '');
    load();
  }catch(e){ toast(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'The Tally Bridge is not answering. Is it running on this computer?' : e.message, 'err'); }
}
/* ---------- Tally -> WMS: items and parties ---------- */
async function pullPlan(){
  if (!window.WMSTally || !WMSTally.planPull) throw new Error('Tally module did not load. Keep wms-tally.js next to this page.');
  const co = await bridgeCall('/companies');
  const open = (co.companies || []).map(x => x.name);
  const mapped = S.lk.tallyCos.map(t => t.company_name).filter(n => open.includes(n));
  const companies = mapped.length ? mapped : open;
  if (!companies.length) throw new Error('No company is open in TallyPrime.');
  const items = [], parties = [];
  for (const company of companies){
    const ask = async key => (await bridgeCall('/export', {company, xml:WMSTally.PULL_REQUESTS[key](company)})).xml;
    items.push(...WMSTally.parseItems(await ask('items')));
    const [lx, gx] = [await ask('ledgers'), await ask('groups')];
    parties.push(...WMSTally.parseParties(lx, gx));
  }
  const one = async q => { const {data, error} = await q; if (error) throw error; return data || []; };
  const [wi, wp] = await Promise.all([
    one(S.sb.from('v_items_master').select('id,sku,name,hsn_code,mrp,std_purchase_price,track_batch,track_expiry,tally_stock_item,current_gst_rate,current_cess_rate,gst_from').eq('tenant_id', S.tenant).limit(50000)),
    one(S.sb.from('parties').select('id,name,party_type,gstin,state_code,address1,address2,pincode,phone,email,tally_ledger').eq('tenant_id', S.tenant).limit(50000))]);
  return {companies, plan:WMSTally.planPull({items, parties}, {items:wi, parties:wp, today:isoToday()}), read:{items:items.length, parties:parties.length}};
}
async function pullApply(plan){
  const out = {items_new:0, items_updated:0, rates:0, parties_new:0, parties_updated:0, skipped:plan.items.skipped.length + plan.parties.skipped.length, errors:[]};
  const chunk = (a, n) => Array.from({length:Math.ceil(a.length / n)}, (_, i) => a.slice(i * n, i * n + n));
  for (const part of chunk(plan.items.create, 200)){
    const {data, error} = await S.sb.from('items').insert(part.map(c => ({...c.row, tenant_id:S.tenant}))).select('id,sku');
    if (error){ out.errors.push('Items: ' + error.message); continue; }
    out.items_new += data.length;
    const bySku = Object.fromEntries(data.map(x => [x.sku, x.id]));
    const rates = part.filter(c => bySku[c.row.sku]).map(c => ({tenant_id:S.tenant, item_id:bySku[c.row.sku], ...c.rate}));
    const {error:re} = await S.sb.from('item_gst_rates').insert(rates);
    if (re) out.errors.push('GST rates: ' + re.message); else out.rates += rates.length;
  }
  for (const u of plan.items.update){
    const {error} = await S.sb.from('items').update(u.changes).eq('id', u.id);
    if (error) out.errors.push(`${u.name}: ${error.message}`); else out.items_updated++;
  }
  if (plan.items.rates.length){
    const {error} = await S.sb.from('item_gst_rates').insert(plan.items.rates.map(r => ({tenant_id:S.tenant, item_id:r.item_id, effective_from:r.effective_from, gst_rate:r.gst_rate, cess_rate:r.cess_rate})));
    if (error) out.errors.push('GST rates: ' + error.message); else out.rates += plan.items.rates.length;
  }
  for (const part of chunk(plan.parties.create, 200)){
    const {data, error} = await S.sb.from('parties').insert(part.map(p => ({...p, tenant_id:S.tenant}))).select('id');
    if (error) out.errors.push('Parties: ' + error.message); else out.parties_new += data.length;
  }
  for (const u of plan.parties.update){
    const {error} = await S.sb.from('parties').update(u.changes).eq('id', u.id);
    if (error) out.errors.push(`${u.name}: ${error.message}`); else out.parties_updated++;
  }
  if (out.items_new || out.parties_new || out.items_updated || out.parties_updated) await loadLookups();
  return out;
}
